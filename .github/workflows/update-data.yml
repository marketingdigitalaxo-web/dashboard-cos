name: Actualizar datos del dashboard

on:
  schedule:
    # Objetivo: actualizar a las 08:00 y a las 14:00 hora de Chile.
    # El cron de GitHub va en UTC y Chile cambia entre UTC-3 (verano) y
    # UTC-4 (invierno), así que se programan ambas horas UTC posibles.
    # GitHub suele atrasar los cron (a veces horas), por eso NO se filtra
    # por hora exacta: una corrida extra solo vuelve a bajar la planilla.
    # Se usa el minuto :07 porque los cron en punto son los que más se
    # atrasan o se pierden.
    - cron: '7 11 * * *'  # 08:07 Chile verano (UTC-3) / 07:07 invierno
    - cron: '7 12 * * *'  # 09:07 Chile verano / 08:07 invierno (UTC-4)
    - cron: '7 17 * * *'  # 14:07 Chile verano (UTC-3) / 13:07 invierno
    - cron: '7 18 * * *'  # 15:07 Chile verano / 14:07 invierno (UTC-4)
  workflow_dispatch: {} # permite correrlo manualmente desde la pestaña "Actions"

permissions:
  contents: write

# Evita que dos corridas atrasadas choquen al hacer push.
concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar hora de Chile
        run: |
          echo "Hora actual en Chile: $(TZ=America/Santiago date '+%Y-%m-%d %H:%M')"

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar datos desde Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python scripts/fetch_data.py

      - name: Commitear datos si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos, no se crea commit."
          else
            git commit -m "Actualiza datos del dashboard ($(TZ=America/Santiago date +'%Y-%m-%d %H:%M') Chile)"
            git pull --rebase
            git push
          fi
