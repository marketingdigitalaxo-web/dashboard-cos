name: Actualizar datos del dashboard

on:
  schedule:
    # 12:00 UTC ≈ 08:00-09:00 en Chile continental (según horario de
    # verano). Deja un colchón de varias horas después de que corra el
    # trigger diario de Apps Script (Codigo.gs, HORA_TRIGGER) para
    # asegurar que la hoja ya esté actualizada cuando este workflow lea.
    - cron: '0 12 * * *'
  workflow_dispatch: {} # permite correrlo manualmente desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar datos desde Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python scripts/fetch_data.py

      - name: Commitear datos si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos, no se crea commit."
          else
            git commit -m "Actualiza datos del dashboard ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
